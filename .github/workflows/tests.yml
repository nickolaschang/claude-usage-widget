name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # People download one zip per platform, so each zip has to work without the other edition's folder.
  packages:
    name: release zips work standalone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and unpack both zips the way the release workflow does
        shell: bash
        run: |
          shared="pricing.json README.md LICENSE AGENTS.md docs"
          git archive --format=zip --prefix=w/ -o w.zip HEAD windows $shared
          git archive --format=zip --prefix=p/ -o p.zip HEAD python $shared
          mkdir out && cd out && unzip -q ../w.zip && unzip -q ../p.zip

      - name: Portable zip, tests pass without the windows folder
        shell: bash
        run: cd out/p && python -m unittest discover -s python/tests -v

      - name: Windows zip, engine runs from the unpacked copy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\empty" | Out-Null
          $json = pwsh -NoProfile -File out\w\windows\ClaudeUsageWidget.ps1 -SelfTest -AsJson -ProjectsRoot "$env:RUNNER_TEMP\empty"
          $json
          if (($json | ConvertFrom-Json).responses -ne 0) { throw 'expected zero responses from an empty folder' }

  # The same check Anthropic's plugin review pipeline runs, in strict mode so warnings fail too.
  plugin:
    name: Claude Code plugin validates (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace, the plugin manifest and the skills
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate skills --strict

  engine:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # 3.9 is what ships with the macOS developer tools, so it is the floor we promise.
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Engine, feed and cross-edition tests
        run: python -m unittest discover -s python/tests -v

      # The window code differs per platform (borderless style, stay-on-top), so open a real one.
      - name: Window smoke test (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb tk
          CUW_GUI_TESTS=1 xvfb-run -a python -m unittest python/tests/test_widget.py -v

      - name: Window smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: CUW_GUI_TESTS=1 python -m unittest python/tests/test_widget.py -v

      - name: Command line smoke test on an empty transcripts folder
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/projects" "$RUNNER_TEMP/state"
          export CLAUDE_USAGE_WIDGET_STATE_DIR="$RUNNER_TEMP/state"
          for format in summary oneline xbar waybar json; do
            echo "--- $format"
            python python/claude_usage.py --projects-root "$RUNNER_TEMP/projects" --format "$format"
          done
