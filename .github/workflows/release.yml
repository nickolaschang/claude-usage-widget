name: release

# Pushing a tag like v0.1.0 builds one zip per platform and attaches them to that release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Claude Code pins plugin users to the version string in plugin.json, so a release whose tag
      # and plugin version disagree would leave them on the old copy without anyone noticing.
      - name: The tag must match the plugin version
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version. Bump .claude-plugin/plugin.json and CHANGELOG.md first."
            exit 1
          fi

      - name: Build one zip per platform
        run: |
          tag="${GITHUB_REF_NAME}"
          shared="pricing.json README.md LICENSE AGENTS.md"
          # git archive applies .gitattributes, so .ps1 files come out CRLF and .py files LF.
          git archive --format=zip --prefix=usage-widget/ -o "usage-widget-windows-${tag}.zip" HEAD windows $shared
          git archive --format=zip --prefix=usage-widget/ -o "usage-widget-macos-linux-${tag}.zip" HEAD python $shared
          ls -l *.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" usage-widget-*.zip --clobber
